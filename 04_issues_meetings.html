<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeRide — 이슈트래커 & 회의록</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:#0f1117;color:#e8e9ed;min-height:100vh;padding:24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{font-size:13px;font-weight:600;color:#fff;background:#1e2030;border:1px solid #2a2d3e;border-radius:8px;padding:6px 12px}
.page-title{font-size:18px;font-weight:600;color:#fff}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid #2a2d3e;margin-bottom:18px}
.tab{padding:9px 20px;font-size:13px;cursor:pointer;color:#6b6f88;border-bottom:2px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:#fff;border-bottom-color:#3d5afe}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:#1a1d2e;border:1px solid #2a2d3e;border-radius:10px;padding:12px;text-align:center}
.stat-n{font-size:24px;font-weight:600;color:#fff}
.stat-l{font-size:10px;color:#4a4f6a;margin-top:2px;letter-spacing:.5px}

/* toolbar */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=text]{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #2a2d3e;background:#1a1d2e;color:#e8e9ed;font-family:inherit;outline:none}
.toolbar select:focus,.toolbar input:focus{border-color:#3d5afe}
.add-btn{padding:6px 14px;border-radius:8px;border:1px solid #3d5afe44;background:#1e2540;color:#7c9bff;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto;transition:all .15s}
.add-btn:hover{background:#253060}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:#4a4f6a;font-weight:500;border-bottom:1px solid #2a2d3e;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1e2030;vertical-align:middle}
tr:hover td{background:#1a1d2e}
tr.done-row td{opacity:.5}

/* badges */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500;white-space:nowrap}
.b-bug{background:#1f1010;color:#f47c5a;border:1px solid #7a2a1a}
.b-feat{background:#1a1535;color:#a89cf7;border:1px solid #3d2fa0}
.b-imp{background:#0d1f1a;color:#4ecba0;border:1px solid #1d6e52}
.b-high{background:#1f1010;color:#f47c5a}
.b-mid{background:#1e1608;color:#f4b942}
.b-low{background:#171920;color:#6b6f88}
.b-open{background:#0d1929;color:#6aaeff}
.b-prog{background:#1e1608;color:#f4b942}
.b-done{background:#0e1a0d;color:#6ecf5a}

/* issue form modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1a1d2e;border:1px solid #2a2d3e;border-radius:16px;padding:24px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;color:#fff;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:#6b6f88;margin-bottom:5px;display:block;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #2a2d3e;background:#13151f;color:#e8e9ed;font-size:13px;font-family:inherit;outline:none;transition:border .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#3d5afe}
.form-textarea{min-height:70px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn-cancel{padding:8px 16px;border-radius:8px;border:1px solid #2a2d3e;background:transparent;color:#8b8fa8;font-size:13px;cursor:pointer;font-family:inherit}
.btn-save{padding:8px 16px;border-radius:8px;border:none;background:#3d5afe;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
.btn-cancel:hover{background:#252840}
.btn-save:hover{background:#5170ff}

/* meetings */
.meeting-card{background:#1a1d2e;border:1px solid #2a2d3e;border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border .15s}
.meeting-card:hover{border-color:#3a3d52}
.meeting-card.open-card{border-color:#3d5afe44}
.meeting-head{padding:14px 16px;display:flex;align-items:center;gap:10px}
.meeting-icon{font-size:16px;flex-shrink:0}
.meeting-title{font-size:13px;font-weight:600;color:#fff;flex:1}
.meeting-meta{font-size:11px;color:#4a4f6a}
.meeting-chevron{color:#4a4f6a;font-size:16px;transition:transform .2s}
.meeting-card.open-card .meeting-chevron{transform:rotate(180deg)}
.meeting-body{padding:0 16px 14px;border-top:1px solid #1e2030}
.m-section{margin-top:12px}
.m-sec-title{font-size:10px;font-weight:600;color:#4a4f6a;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.m-item{display:flex;gap:7px;font-size:12px;color:#8b8fa8;padding:3px 0;line-height:1.5;align-items:flex-start}
.m-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:6px}
.d-purple{background:#a89cf7}
.d-teal{background:#4ecba0}
.d-blue{background:#6aaeff}

/* new meeting form */
.new-meeting-area{background:#13151f;border:1px dashed #2a2d3e;border-radius:12px;padding:18px;margin-bottom:14px}
</style>
</head>
<body>
<div class="top">
  <span class="logo">🚌 SafeRide</span>
  <span class="page-title">이슈트래커 & 회의록</span>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('issues')">이슈 트래커</button>
  <button class="tab" onclick="showTab('meetings')">회의록</button>
</div>

<!-- ISSUES TAB -->
<div id="tab-issues">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <select id="f-status" onchange="render()">
      <option value="">전체 상태</option>
      <option value="open">열림</option>
      <option value="progress">진행 중</option>
      <option value="done">완료</option>
    </select>
    <select id="f-type" onchange="render()">
      <option value="">전체 유형</option>
      <option value="bug">버그</option>
      <option value="feat">기능</option>
      <option value="imp">개선</option>
    </select>
    <select id="f-priority" onchange="render()">
      <option value="">전체 우선순위</option>
      <option value="high">높음</option>
      <option value="mid">중간</option>
      <option value="low">낮음</option>
    </select>
    <select id="f-phase" onchange="render()">
      <option value="">전체 Phase</option>
      <option value="P1">Phase 1</option>
      <option value="P2">Phase 2</option>
      <option value="P3">Phase 3</option>
    </select>
    <input type="text" id="f-search" placeholder="이슈 검색..." oninput="render()" style="min-width:140px">
    <button class="add-btn" onclick="openModal()">+ 이슈 추가</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>제목</th><th>유형</th><th>우선순위</th><th>상태</th><th>담당자</th><th>Phase</th><th>액션</th>
        </tr>
      </thead>
      <tbody id="issue-tbody"></tbody>
    </table>
  </div>
</div>

<!-- MEETINGS TAB -->
<div id="tab-meetings" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span style="font-size:12px;color:#4a4f6a">총 <span id="meeting-cnt">0</span>개의 회의록</span>
    <button class="add-btn" onclick="toggleNewMeeting()">+ 새 회의록</button>
  </div>
  <div id="new-meeting-area" style="display:none">
    <div class="new-meeting-area">
      <div class="form-row" style="margin-bottom:12px">
        <div class="form-group" style="margin:0"><label class="form-label">회의 제목</label><input class="form-input" id="nm-title" placeholder="예: Phase 1 킥오프"></div>
        <div class="form-group" style="margin:0"><label class="form-label">날짜</label><input class="form-input" id="nm-date" type="date"></div>
      </div>
      <div class="form-group"><label class="form-label">참석자</label><input class="form-input" id="nm-att" placeholder="예: 김개발, 이디자인"></div>
      <div class="form-group"><label class="form-label">논의 내용 (줄바꿈으로 구분)</label><textarea class="form-textarea" id="nm-agenda" placeholder="주요 논의 사항..."></textarea></div>
      <div class="form-group"><label class="form-label">결정 사항 (줄바꿈으로 구분)</label><textarea class="form-textarea" id="nm-dec" placeholder="확정된 결정..."></textarea></div>
      <div class="form-group" style="margin-bottom:0"><label class="form-label">액션 아이템 (줄바꿈으로 구분)</label><textarea class="form-textarea" id="nm-act" placeholder="담당자: 할 일 형식..."></textarea></div>
      <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
        <button class="btn-cancel" onclick="toggleNewMeeting()">취소</button>
        <button class="btn-save" onclick="saveMeeting()">저장</button>
      </div>
    </div>
  </div>
  <div id="meeting-list"></div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-title">이슈 추가</div>
    <div class="form-group"><label class="form-label">제목</label><input class="form-input" id="m-title" placeholder="이슈 제목을 입력하세요"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">유형</label>
        <select class="form-select" id="m-type"><option value="bug">버그</option><option value="feat" selected>기능</option><option value="imp">개선</option></select>
      </div>
      <div class="form-group"><label class="form-label">우선순위</label>
        <select class="form-select" id="m-priority"><option value="high">높음</option><option value="mid" selected>중간</option><option value="low">낮음</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">담당자</label><input class="form-input" id="m-owner" placeholder="미배정"></div>
      <div class="form-group"><label class="form-label">Phase</label>
        <select class="form-select" id="m-phase"><option value="P1">Phase 1</option><option value="P2">Phase 2</option><option value="P3">Phase 3</option></select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">설명 (선택)</label><textarea class="form-textarea" id="m-desc" placeholder="상세 내용..."></textarea></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveIssue()">추가</button>
    </div>
  </div>
</div>

<script>
let issues=[
  {id:'#001',title:'GPS 권한 거부 시 안내 화면 미표시',type:'bug',priority:'high',status:'open',owner:'김개발',phase:'P1',desc:'iOS Safari에서 GPS 권한을 거부하면 빈 화면만 보임'},
  {id:'#002',title:'경로 공유 링크 생성 API 구현',type:'feat',priority:'high',status:'progress',owner:'김개발',phase:'P1',desc:'POST /api/sessions 엔드포인트 + UUID 토큰 발급'},
  {id:'#003',title:'부모 UI 글자 크기 18pt 이상 적용',type:'imp',priority:'mid',status:'done',owner:'이디자인',phase:'P1',desc:'접근성 기준 최소 18pt, 터치 영역 48px 이상'},
  {id:'#004',title:'카카오 알림톡 템플릿 심사 신청',type:'feat',priority:'high',status:'open',owner:'미배정',phase:'P1',desc:'카카오 비즈니스 채널 개설 + 템플릿 3종 심사'},
  {id:'#005',title:'WebSocket 연결 끊김 재연결 로직',type:'feat',priority:'mid',status:'open',owner:'김개발',phase:'P1',desc:'exponential backoff 재연결, 최대 5회 시도'},
  {id:'#006',title:'탑승 감지 오탐지 (도보 이동 시)',type:'bug',priority:'high',status:'progress',owner:'김개발',phase:'P1',desc:'걷는 속도(5km/h 이하)에서도 정류장 근처면 탑승으로 감지됨'},
  {id:'#007',title:'하차 알림 정확도 테스트',type:'imp',priority:'mid',status:'open',owner:'박테스터',phase:'P1',desc:'실제 버스 탑승 테스트 5회 이상 진행'},
  {id:'#008',title:'Redis TTL 세션 만료 로직',type:'feat',priority:'low',status:'open',owner:'김개발',phase:'P1',desc:'세션 완료 또는 24시간 경과 시 자동 삭제'},
  {id:'#009',title:'환승 구간 상태머신 설계',type:'feat',priority:'mid',status:'open',owner:'미배정',phase:'P2',desc:'다중 구간 처리: waiting→boarding→transit→alighting→arrived'},
  {id:'#010',title:'경로 이탈 감지 알고리즘',type:'feat',priority:'mid',status:'open',owner:'미배정',phase:'P2',desc:'경로 폴리라인 기반 200m 이탈 + 30초 지속 조건'},
];

let meetings=[
  {id:1,title:'Phase 1 킥오프',date:'2025-06-02',att:'김개발, 이디자인, 박테스터',
    agenda:['프로젝트 목표 및 MVP 범위 공유','기술 스택 최종 확정 (React + Node.js + Socket.io)','역할 분담 결정','스프린트 계획 수립'],
    dec:['MVP 기간: 6월~7월 말 (8주)','배포 플랫폼: Railway 사용','부모 앱은 설치 없이 링크 기반으로 시작','주 1회 스탠드업 미팅 진행'],
    act:['김개발: 프로젝트 모노레포 셋업 (6/5까지)','이디자인: 부모 UI 와이어프레임 (6/9까지)','박테스터: 테스트 케이스 초안 작성']},
  {id:2,title:'카카오 API 연동 리뷰',date:'2025-06-10',att:'김개발, 이디자인',
    agenda:['카카오 모빌리티 API 응답 구조 분석','경로 데이터 파싱 전략 논의','일일 호출 한도 (10만건) 관리 방안'],
    dec:['환승 정보는 legs 배열로 파싱','정류장 좌표는 세션 생성 시 DB 저장','API 응답 캐싱: Redis TTL 5분'],
    act:['김개발: 경로 파싱 모듈 구현','이디자인: 경로 선택 UI 구현','김개발: API 호출 횟수 모니터링 대시보드']},
];
let openMeetings={};
let nextId=issues.length+1;

const tlabel={bug:'버그',feat:'기능',imp:'개선'};
const tcls={bug:'b-bug',feat:'b-feat',imp:'b-imp'};
const plabel={high:'높음',mid:'중간',low:'낮음'};
const pcls={high:'b-high',mid:'b-mid',low:'b-low'};
const slabel={open:'열림',progress:'진행 중',done:'완료'};
const scls={open:'b-open',progress:'b-prog',done:'b-done'};

function renderStats(){
  const t=issues.length,o=issues.filter(i=>i.status==='open').length,p=issues.filter(i=>i.status==='progress').length,d=issues.filter(i=>i.status==='done').length;
  document.getElementById('stats').innerHTML=[{n:t,l:'전체'},{n:o,l:'열린 이슈'},{n:p,l:'진행 중'},{n:d,l:'완료'}]
    .map(s=>`<div class="stat"><div class="stat-n">${s.n}</div><div class="stat-l">${s.l}</div></div>`).join('');
}

function render(){
  renderStats();
  const fs=document.getElementById('f-status').value;
  const ft=document.getElementById('f-type').value;
  const fp=document.getElementById('f-priority').value;
  const fph=document.getElementById('f-phase').value;
  const fq=document.getElementById('f-search').value.toLowerCase();
  const list=issues.filter(i=>
    (!fs||i.status===fs)&&(!ft||i.type===ft)&&(!fp||i.priority===fp)&&(!fph||i.phase===fph)&&(!fq||i.title.toLowerCase().includes(fq))
  );
  document.getElementById('issue-tbody').innerHTML=list.map(i=>`
    <tr class="${i.status==='done'?'done-row':''}">
      <td style="color:#4a4f6a;font-family:monospace">${i.id}</td>
      <td style="max-width:240px">
        <div style="color:#e8e9ed;font-weight:500">${i.title}</div>
        ${i.desc?`<div style="font-size:10px;color:#4a4f6a;margin-top:2px">${i.desc}</div>`:''}
      </td>
      <td><span class="badge ${tcls[i.type]}">${tlabel[i.type]}</span></td>
      <td><span class="badge ${pcls[i.priority]}">${plabel[i.priority]}</span></td>
      <td>
        <select class="badge ${scls[i.status]}" onchange="changeStatus('${i.id}',this.value)" style="border:none;cursor:pointer;font-family:inherit;font-size:10px;padding:2px 5px;border-radius:5px">
          <option value="open" ${i.status==='open'?'selected':''}>열림</option>
          <option value="progress" ${i.status==='progress'?'selected':''}>진행 중</option>
          <option value="done" ${i.status==='done'?'selected':''}>완료</option>
        </select>
      </td>
      <td style="color:#8b8fa8">${i.owner}</td>
      <td style="color:#4a4f6a">${i.phase}</td>
      <td><button onclick="deleteIssue('${i.id}')" style="background:none;border:none;cursor:pointer;color:#3a3d52;font-size:14px" title="삭제">✕</button></td>
    </tr>
  `).join('');
}

function changeStatus(id,val){
  const iss=issues.find(i=>i.id===id);
  if(iss){iss.status=val;render();}
}
function deleteIssue(id){
  if(confirm('이슈를 삭제할까요?')){issues=issues.filter(i=>i.id!==id);render();}
}
function openModal(){document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function saveIssue(){
  const title=document.getElementById('m-title').value.trim();
  if(!title){alert('제목을 입력하세요');return;}
  issues.unshift({
    id:`#${String(nextId++).padStart(3,'0')}`,
    title,
    type:document.getElementById('m-type').value,
    priority:document.getElementById('m-priority').value,
    status:'open',
    owner:document.getElementById('m-owner').value||'미배정',
    phase:document.getElementById('m-phase').value,
    desc:document.getElementById('m-desc').value,
  });
  document.getElementById('m-title').value='';
  document.getElementById('m-desc').value='';
  closeModal();render();
}

function showTab(t){
  document.getElementById('tab-issues').style.display=t==='issues'?'block':'none';
  document.getElementById('tab-meetings').style.display=t==='meetings'?'block':'none';
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['issues','meetings'][i]===t));
}

function renderMeetings(){
  document.getElementById('meeting-cnt').textContent=meetings.length;
  document.getElementById('meeting-list').innerHTML=meetings.map(m=>`
    <div class="meeting-card${openMeetings[m.id]?' open-card':''}" onclick="toggleMeeting(${m.id})">
      <div class="meeting-head">
        <span class="meeting-icon">📝</span>
        <span class="meeting-title">${m.title}</span>
        <span class="meeting-meta">${m.date} · ${m.att.split(',').length}명</span>
        <span class="meeting-chevron">⌄</span>
      </div>
      ${openMeetings[m.id]?`
      <div class="meeting-body">
        <div class="m-section">
          <div class="m-sec-title">참석자</div>
          <div class="m-item"><div class="m-dot d-purple"></div><span>${m.att}</span></div>
        </div>
        <div class="m-section">
          <div class="m-sec-title">논의 내용</div>
          ${m.agenda.map(a=>`<div class="m-item"><div class="m-dot d-purple"></div><span>${a}</span></div>`).join('')}
        </div>
        <div class="m-section">
          <div class="m-sec-title">결정 사항</div>
          ${m.dec.map(d=>`<div class="m-item"><div class="m-dot d-teal"></div><span>${d}</span></div>`).join('')}
        </div>
        <div class="m-section">
          <div class="m-sec-title">액션 아이템</div>
          ${m.act.map(a=>`<div class="m-item"><div class="m-dot d-blue"></div><span>${a}</span></div>`).join('')}
        </div>
      </div>`:''}
    </div>
  `).join('');
}

function toggleMeeting(id){openMeetings[id]=!openMeetings[id];renderMeetings();}
function toggleNewMeeting(){
  const el=document.getElementById('new-meeting-area');
  el.style.display=el.style.display==='none'?'block':'none';
  if(el.style.display==='block'){
    document.getElementById('nm-date').value=new Date().toISOString().slice(0,10);
  }
}
function saveMeeting(){
  const title=document.getElementById('nm-title').value.trim();
  if(!title){alert('제목을 입력하세요');return;}
  meetings.unshift({
    id:Date.now(),
    title,
    date:document.getElementById('nm-date').value||new Date().toISOString().slice(0,10),
    att:document.getElementById('nm-att').value||'미입력',
    agenda:document.getElementById('nm-agenda').value.split('\n').filter(l=>l.trim()),
    dec:document.getElementById('nm-dec').value.split('\n').filter(l=>l.trim()),
    act:document.getElementById('nm-act').value.split('\n').filter(l=>l.trim()),
  });
  ['nm-title','nm-att','nm-agenda','nm-dec','nm-act'].forEach(id=>document.getElementById(id).value='');
  toggleNewMeeting();renderMeetings();
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
render();renderMeetings();
</script>
</body>
</html>
